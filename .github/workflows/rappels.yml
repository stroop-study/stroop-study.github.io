# Rappels de Stroop Study : vérifie toutes les 15 minutes qui doit recevoir une notification.
name: Rappels
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Que faire ?'
        type: choice
        default: test
        options:
          - test
          - essai
          - normal
concurrency: rappels
jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notif
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Envoyer les rappels
        run: node notif/envoi.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' && '1' || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'essai' && '1' || '0' }}
